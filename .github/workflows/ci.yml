name: CI Pipeline

on:
  push:
    branches:
      - feat/praktikum-9

env:
  DOCKER_IMAGE_NAME: harmanhakim/sidatingapp-fe
  IMAGE_TAG: ${{ github.sha }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_BE2_API_URL: ${{ secrets.VITE_BE2_API_URL }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker
        run: sudo apt-get update && sudo apt-get install -y docker.io rsync openssh-client

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync files to EC2
        run: |
          rsync -avz --delete --exclude=node_modules --exclude=.git . ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Build and push Docker image on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ~/app &&
            sudo docker build --build-arg VITE_API_URL=${{ env.VITE_API_URL }} --build-arg VITE_BE2_API_URL=${{ env.VITE_BE2_API_URL }} -t $DOCKER_IMAGE_NAME:$IMAGE_TAG . &&
            echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin &&
            sudo docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
          "

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install SSH
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Replace image tag in deployment
        run: sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml

      - name: Copy k8s files to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/app/k8s"
          scp deployment.yaml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/k8s/deployment.yaml
          scp k8s/service.yaml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/k8s/service.yaml
          scp k8s/ingress.yaml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/k8s/ingress.yaml

      - name: Apply to k3s and cleanup
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/deployment.yaml &&
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/service.yaml &&
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/ingress.yaml &&
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout restart deployment/sidatingapp-fe &&
            sudo docker image prune -a -f &&
            sudo docker container prune -f
          "